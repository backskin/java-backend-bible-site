<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="IBM Plex Sans, Segoe UI, Roboto, Arial, sans-serif">
  <title>WebSocket: рукопожатие и кадры</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4654"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8481f"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="559" rx="14" fill="#fbfcfd" stroke="#d8dee6"/>

  <!-- участники -->
  <rect x="40" y="22" width="200" height="44" rx="10" fill="#eef2f7" stroke="#c9d1da"/>
  <text x="140" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#14181d">Браузер диспетчера</text>
  <text x="140" y="58" text-anchor="middle" font-size="11.5" fill="#5d6874">клиент</text>
  <rect x="520" y="22" width="200" height="44" rx="10" fill="#f8eee8" stroke="#e2c2b0"/>
  <text x="620" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#14181d">Сервис карты</text>
  <text x="620" y="58" text-anchor="middle" font-size="11.5" fill="#5d6874">Tomcat, /ws/map</text>
  <line x1="140" y1="66" x2="140" y2="540" stroke="#9aa6b2" stroke-dasharray="4 5"/>
  <line x1="620" y1="66" x2="620" y2="540" stroke="#9aa6b2" stroke-dasharray="4 5"/>

  <!-- HTTP -->
  <rect x="152" y="80" width="456" height="128" rx="8" fill="#eef4fb"/>
  <text x="164" y="97" font-size="11" font-weight="600" fill="#1b56a3" letter-spacing=".08em">HTTP/1.1</text>
  <line x1="142" y1="118" x2="616" y2="118" stroke="#3a4654" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="380" y="112" text-anchor="middle" font-size="13" fill="#14181d" font-family="JetBrains Mono, Consolas, monospace">GET /ws/map?region=%D0%A3…  Upgrade: websocket</text>
  <text x="380" y="134" text-anchor="middle" font-size="11.5" fill="#5d6874">Sec-WebSocket-Key: случайные 16 байт в Base64, версия 13</text>
  <line x1="618" y1="170" x2="144" y2="170" stroke="#3a4654" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="380" y="164" text-anchor="middle" font-size="13" fill="#14181d" font-family="JetBrains Mono, Consolas, monospace">101  Sec-WebSocket-Accept: s3pPLMBi…</text>
  <text x="380" y="188" text-anchor="middle" font-size="11.5" fill="#5d6874">Base64(SHA-1(ключ + 258EAFA5-E914-47DA-95CA-C5AB0DC85B11))</text>

  <!-- граница -->
  <line x1="40" y1="224" x2="720" y2="224" stroke="#a8481f" stroke-dasharray="6 4"/>
  <rect x="268" y="214" width="224" height="20" rx="10" fill="#fbfcfd"/>
  <text x="380" y="228" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a8481f">дальше по тому же TCP — кадры</text>

  <!-- кадры -->
  <line x1="142" y1="266" x2="616" y2="266" stroke="#3a4654" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="380" y="260" text-anchor="middle" font-size="12.5" fill="#14181d" font-family="JetBrains Mono, Consolas, monospace">81 8d 37 fa 21 3d 4c d8 4e 4d …</text>
  <text x="380" y="282" text-anchor="middle" font-size="11.5" fill="#5d6874">текст (opcode 1), бит маски и 4 байта маски: клиент обязан маскировать</text>

  <line x1="618" y1="316" x2="144" y2="316" stroke="#3a4654" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="380" y="310" text-anchor="middle" font-size="12.5" fill="#14181d" font-family="JetBrains Mono, Consolas, monospace">81 17 {"type":"ack","len":13}</text>
  <text x="380" y="332" text-anchor="middle" font-size="11.5" fill="#5d6874">сервер не маскирует, заголовок кадра 2 байта</text>

  <line x1="618" y1="370" x2="144" y2="370" stroke="#a8481f" stroke-width="2.2" marker-end="url(#ag)"/>
  <text x="380" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="#a8481f">сервер говорит первым: seq 6, 7, 8 …</text>
  <text x="380" y="386" text-anchor="middle" font-size="11.5" fill="#5d6874">события о вагонах без запроса клиента</text>

  <line x1="618" y1="420" x2="144" y2="420" stroke="#3a4654" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="380" y="414" text-anchor="middle" font-size="12.5" fill="#14181d">ping (opcode 9)</text>
  <line x1="142" y1="446" x2="616" y2="446" stroke="#3a4654" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="380" y="440" text-anchor="middle" font-size="12.5" fill="#14181d">pong (opcode 10) — клиент отвечает сам</text>

  <line x1="142" y1="490" x2="616" y2="490" stroke="#3a4654" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="380" y="484" text-anchor="middle" font-size="12.5" fill="#14181d">close 1000 «конец смены»</text>
  <line x1="618" y1="514" x2="144" y2="514" stroke="#3a4654" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="380" y="508" text-anchor="middle" font-size="12.5" fill="#14181d">close 1000</text>
  <text x="380" y="540" text-anchor="middle" font-size="11" fill="#5d6874">1006 по сети не передаётся: это запись в журнале, когда кадра закрытия не было</text>
</svg>
