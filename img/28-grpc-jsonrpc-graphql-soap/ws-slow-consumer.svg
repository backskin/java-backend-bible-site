<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="IBM Plex Sans, Segoe UI, Roboto, Arial, sans-serif">
  <title>Медленный клиент: прямая рассылка и очередь на клиента</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a4654"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="399" rx="14" fill="#fbfcfd" stroke="#d8dee6"/>
  <line x1="380" y1="20" x2="380" y2="380" stroke="#d8dee6"/>

  <!-- левая панель -->
  <text x="190" y="36" text-anchor="middle" font-size="14.5" font-weight="700" fill="#14181d">Прямая рассылка</text>
  <text x="190" y="54" text-anchor="middle" font-size="11.5" fill="#5d6874">один цикл, sendText() ждёт место в сокете</text>
  <rect x="30" y="80" width="110" height="56" rx="10" fill="#eef2f7" stroke="#c9d1da"/>
  <text x="85" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#14181d">publish()</text>
  <text x="85" y="122" text-anchor="middle" font-size="11" fill="#5d6874">for (клиент…)</text>
  <rect x="230" y="70" width="130" height="50" rx="10" fill="#fdeceb" stroke="#e6a9a3"/>
  <text x="295" y="92" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14181d">зависшая вкладка</text>
  <text x="295" y="109" text-anchor="middle" font-size="11" fill="#c0392b">буфер полон</text>
  <rect x="230" y="160" width="130" height="50" rx="10" fill="#eef2f7" stroke="#c9d1da"/>
  <text x="295" y="182" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14181d">диспетчер</text>
  <text x="295" y="199" text-anchor="middle" font-size="11" fill="#5d6874">читает исправно</text>
  <line x1="140" y1="100" x2="226" y2="95" stroke="#c0392b" stroke-width="2" marker-end="url(#r)"/>
  <line x1="140" y1="118" x2="226" y2="182" stroke="#9aa6b2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="150" y="160" font-size="11" fill="#5d6874">ждёт своей очереди</text>
  <rect x="30" y="240" width="330" height="120" rx="10" fill="#fff6f5" stroke="#f0c8c3"/>
  <text x="46" y="266" font-size="13" font-weight="600" fill="#c0392b">событие 664: цикл стоит 3 047 мс</text>
  <text x="46" y="288" font-size="12" fill="#14181d">все клиенты региона ждут одного зависшего</text>
  <text x="46" y="308" font-size="12" fill="#14181d">по умолчанию Tomcat ждёт 20 с</text>
  <text x="46" y="328" font-size="12" fill="#14181d">сессия закрыта с 1006, клиент об этом не знает</text>
  <text x="46" y="348" font-size="12" fill="#5d6874">3 000 событий за 8 296 мс</text>

  <!-- правая панель -->
  <text x="570" y="36" text-anchor="middle" font-size="14.5" font-weight="700" fill="#14181d">Очередь на клиента</text>
  <text x="570" y="54" text-anchor="middle" font-size="11.5" fill="#5d6874">цикл только кладёт, отправляет свой поток</text>
  <rect x="400" y="80" width="100" height="56" rx="10" fill="#eef2f7" stroke="#c9d1da"/>
  <text x="450" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#14181d">publish()</text>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#5d6874">offer()</text>
  <!-- очереди -->
  <g>
    <rect x="530" y="72" width="100" height="22" rx="5" fill="#fff" stroke="#e6a9a3"/>
    <rect x="531" y="73" width="98" height="20" rx="4" fill="#f4b6ae"/>
    <text x="580" y="88" text-anchor="middle" font-size="11" fill="#14181d">256 / 256</text>
    <rect x="530" y="168" width="100" height="22" rx="5" fill="#fff" stroke="#c9d1da"/>
    <rect x="531" y="169" width="10" height="20" rx="4" fill="#9fd3b4"/>
    <text x="580" y="184" text-anchor="middle" font-size="11" fill="#14181d">3 / 256</text>
  </g>
  <line x1="500" y1="98" x2="526" y2="86" stroke="#3a4654" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="500" y1="118" x2="526" y2="176" stroke="#3a4654" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="660" y="64" width="86" height="40" rx="9" fill="#fdeceb" stroke="#e6a9a3"/>
  <text x="703" y="82" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14181d">вкладка</text>
  <text x="703" y="97" text-anchor="middle" font-size="11" fill="#c0392b">close 1013</text>
  <rect x="660" y="160" width="86" height="40" rx="9" fill="#e9f5ee" stroke="#a9d6bb"/>
  <text x="703" y="178" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14181d">диспетчер</text>
  <text x="703" y="193" text-anchor="middle" font-size="11" fill="#1a7a48">3 000 из 3 000</text>
  <line x1="630" y1="83" x2="656" y2="83" stroke="#c0392b" stroke-width="1.6" marker-end="url(#r)"/>
  <line x1="630" y1="179" x2="656" y2="179" stroke="#3a4654" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="580" y="128" text-anchor="middle" font-size="10.5" fill="#5d6874">виртуальный поток отправки</text>
  <text x="580" y="141" text-anchor="middle" font-size="10.5" fill="#5d6874">на каждого клиента</text>
  <rect x="400" y="240" width="330" height="120" rx="10" fill="#f2faf5" stroke="#bfe0cc"/>
  <text x="416" y="266" font-size="13" font-weight="600" fill="#1a7a48">самая долгая публикация 63 мс</text>
  <text x="416" y="288" font-size="12" fill="#14181d">переполнение = клиент не успевает читать</text>
  <text x="416" y="308" font-size="12" fill="#14181d">отключаем с 1013, он вернётся с since=seq</text>
  <text x="416" y="328" font-size="12" fill="#14181d">политика заранее: отключить, выбросить, слить</text>
  <text x="416" y="348" font-size="12" fill="#5d6874">3 000 событий за 5 240 мс (темп 1000/с)</text>
</svg>
