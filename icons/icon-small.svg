<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Значок для мелких размеров (96 px и меньше, вкладка браузера): тот же сюжет, что у icon.svg, но перерисован
       крупными простыми формами — толстые контуры, крупные скобки, без бликов, теней и тонких линий страниц. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d86f0"/>
      <stop offset="1" stop-color="#1745b4"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc24a"/>
      <stop offset="1" stop-color="#e68a12"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- блок страниц: одна белая полоса справа и снизу -->
  <rect x="122" y="112" width="306" height="314" rx="26" fill="#ffffff" stroke="#6e3a03" stroke-width="18"/>
  <!-- лента -->
  <path d="M318 400 V468 L346 444 L374 468 V400 Z" fill="#d33a2c" stroke="#6e1008" stroke-width="14" stroke-linejoin="round"/>
  <!-- обложка -->
  <rect x="78" y="80" width="306" height="314" rx="30" fill="url(#cover)" stroke="#6e3a03" stroke-width="18"/>
  <!-- корешок: одна тёмная полоса -->
  <path d="M100 89 H130 V385 H100 A21 21 0 0 1 87 372 V102 A21 21 0 0 1 100 89 Z" fill="#c8700a"/>
  <!-- кофейное зерно: крупное, толстый контур и бороздка -->
  <g transform="translate(257 237) rotate(-28)">
    <ellipse rx="86" ry="114" fill="#5a3218" stroke="#24110a" stroke-width="16"/>
    <path d="M0 -104 C34 -52 -34 52 0 104" fill="none" stroke="#24110a" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
