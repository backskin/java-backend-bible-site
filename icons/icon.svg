<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Значок приложения «Java Backend Bible» (ред. 2026-10-28): синий фон XP, как строка заголовка сайта; в центре
       закрытая книга в янтарной обложке в манере значков глав (тёмный контур, свет сверху слева, мягкая тень),
       на обложке кофейное зерно — Java; красная лента-закладка. Всё — в безопасной зоне значка (круг 80%). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d86f0"/>
      <stop offset="1" stop-color="#1745b4"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36e"/>
      <stop offset="0.55" stop-color="#f4a62a"/>
      <stop offset="1" stop-color="#d77a0a"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8620a"/>
      <stop offset="1" stop-color="#e48f1c"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3ede0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0473a"/>
      <stop offset="1" stop-color="#b52a20"/>
    </linearGradient>
    <linearGradient id="bean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5530"/>
      <stop offset="1" stop-color="#3e2210"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>
  <g transform="translate(256 256) scale(0.9) translate(-256 -256)">
    <!-- тень под книгой -->
    <ellipse cx="270" cy="424" rx="170" ry="20" fill="#08245e" opacity="0.45" filter="url(#soft)"/>
    <!-- блок страниц торцом справа и снизу -->
    <rect x="146" y="116" width="272" height="294" rx="16" fill="url(#pages)" stroke="#7a5a2c" stroke-width="8"/>
    <g stroke="#cdbf9f" stroke-width="4" stroke-linecap="round">
      <path d="M404 150 V380"/><path d="M394 138 V394"/>
    </g>
    <!-- лента-закладка из-под обложки -->
    <path d="M318 372 V440 L336 424 L354 440 V372 Z" fill="url(#ribbon)" stroke="#7a1410" stroke-width="6" stroke-linejoin="round"/>
    <!-- обложка и корешок: почти квадратная, чтобы скобкам хватало полей -->
    <rect x="104" y="98" width="272" height="292" rx="18" fill="url(#cover)" stroke="#8a4a05" stroke-width="9"/>
    <path d="M122 102 H148 V386 H122 A18 18 0 0 1 108 372 V116 A18 18 0 0 1 122 102 Z" fill="url(#spine)"/>
    <path d="M148 106 V382" stroke="#8a4a05" stroke-width="5" opacity="0.6"/>
    <!-- блик на обложке -->
    <path d="M160 114 H356 Q366 114 366 124 V176 Q270 154 160 204 Z" fill="#ffffff" opacity="0.28"/>
    <!-- кофейное зерно (Java) по центру лицевой части обложки (148..376) -->
    <g transform="translate(262 244) rotate(-28)">
      <ellipse rx="74" ry="100" fill="url(#bean)" stroke="#2a1408" stroke-width="9"/>
      <path d="M0 -92 C30 -46 -30 46 0 92" fill="none" stroke="#2a1408" stroke-width="16" stroke-linecap="round"/>
      <path d="M8 -84 C36 -40 -18 40 10 84" fill="none" stroke="#a86a3a" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
      <ellipse cx="-34" cy="-46" rx="16" ry="30" fill="#ffffff" opacity="0.22" transform="rotate(14 -34 -46)"/>
    </g>
  </g>
</svg>
